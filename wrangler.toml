# Cloudflare Pages — static site + PORTAL WebSocket relay
# Il campo name deve coincidere con il nome del progetto Pages in dashboard.
name = "docnasae-mrborg"
compatibility_date = "2024-04-03"
pages_build_output_dir = "."

[[durable_objects.bindings]]
name = "PORTAL_ROOM"
class_name = "PortalRoom"
script_name = "docnasae-mrborg"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PortalRoom"]
