<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <rect width="320" height="200" fill="#050608"/>
  <rect x="8" y="8" width="304" height="184" stroke="#2a1a4a" stroke-width="0.5" stroke-dasharray="3,3"/>
  <g stroke="#2a1a4a" stroke-width="0.45" opacity="0.65">
    <path d="M8 50 L14 50 M8 100 L14 100 M8 150 L14 150"/>
    <path d="M312 50 L306 50 M312 100 L306 100 M312 150 L306 150"/>
  </g>

  <defs>
    <linearGradient id="de-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="100%" stop-color="#12101a"/>
    </linearGradient>
    <linearGradient id="de-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a4a6a" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#44ccff"/>
      <stop offset="100%" stop-color="#e8ffff"/>
    </linearGradient>
    <linearGradient id="de-violet" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#2a0848"/>
      <stop offset="45%" stop-color="#7a28cc"/>
      <stop offset="100%" stop-color="#e8a0ff"/>
    </linearGradient>
    <linearGradient id="de-water" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0c3068"/>
      <stop offset="60%" stop-color="#3a8acc"/>
      <stop offset="100%" stop-color="#d8f4ff"/>
    </linearGradient>
    <linearGradient id="de-ink" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#080a10"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <filter id="de-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="304" height="184" fill="url(#de-bg)" opacity="0.55"/>

  <!-- architectural flow field (chaos currents) -->
  <g stroke="#3a2a5a" stroke-width="0.35" opacity="0.5" fill="none">
    <path d="M24 165 C60 140, 90 110, 130 85 C170 60, 210 45, 280 28"/>
    <path d="M30 175 C75 150, 110 125, 155 95 C200 70, 240 55, 295 38"/>
    <path d="M20 155 C55 130, 100 95, 145 70 C190 48, 235 35, 270 22"/>
  </g>

  <!-- organic shadow tendrils (black liquid curls) -->
  <g filter="url(#de-glow)" opacity="0.95">
    <path d="M48 178 C62 155, 58 128, 72 102 C86 78, 78 58, 92 42 C98 34, 94 28, 88 22"
          stroke="url(#de-ink)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.92"/>
    <path d="M52 172 C68 148, 64 118, 80 92 C94 68, 88 48, 102 32"
          stroke="url(#de-ink)" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.85"/>
    <path d="M44 168 C58 142, 54 112, 70 88 C82 66, 76 50, 90 36"
          stroke="#1a2230" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- hollow purple energy mass + fibers -->
  <g filter="url(#de-glow)" opacity="0.88">
    <ellipse cx="198" cy="88" rx="42" ry="36" fill="#1a0830" opacity="0.55"/>
    <path d="M168 95 C185 72, 210 58, 238 52 C252 50, 248 68, 232 82 C215 98, 188 108, 168 95 Z"
          fill="url(#de-violet)" opacity="0.35"/>
    <path d="M175 92 Q205 55 245 48 Q228 75 210 95 Q190 108 175 92"
          stroke="url(#de-violet)" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M182 88 Q200 62 222 58 M190 98 Q215 72 235 68 M178 102 Q198 78 218 74"
          stroke="#c080ff" stroke-width="0.7" opacity="0.75" stroke-linecap="round"/>
    <circle cx="218" cy="62" r="6" fill="#f0e0ff" opacity="0.7"/>
  </g>

  <!-- water ribbon + white crests (Korra) -->
  <g filter="url(#de-glow)" opacity="0.9">
    <path d="M72 145 Q120 108, 168 78 Q210 52, 262 32"
          stroke="url(#de-water)" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.45"/>
    <path d="M72 145 Q120 108, 168 78 Q210 52, 262 32"
          stroke="url(#de-water)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M74 142 Q122 105, 170 75 Q212 49, 264 29"
          stroke="#e8f8ff" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M76 138 Q124 100, 172 70 Q214 44, 266 24"
          stroke="#ffffff" stroke-width="0.6" stroke-linecap="round" fill="none" opacity="0.7"/>
  </g>

  <!-- thin flow-line bundles (architectural traces) -->
  <g stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M70 148 Q118 111, 166 81 Q208 55, 260 35" stroke="#88c8f0" stroke-width="0.45"/>
    <path d="M68 150 Q116 113, 164 83 Q206 57, 258 37" stroke="#6aa8e0" stroke-width="0.35"/>
    <path d="M72 146 Q120 109, 168 79 Q210 53, 262 33" stroke="#a8e0ff" stroke-width="0.35"/>
    <path d="M180 90 Q205 58 240 50" stroke="#b070ff" stroke-width="0.4"/>
    <path d="M178 92 Q203 60 238 52" stroke="#d0a0ff" stroke-width="0.3"/>
    <path d="M50 170 Q65 140, 78 115" stroke="#3a4458" stroke-width="0.35"/>
    <path d="M52 168 Q67 138, 80 113" stroke="#4a5568" stroke-width="0.3"/>
  </g>

  <!-- electric branch (fine) -->
  <g stroke="#c8e8ff" stroke-width="0.55" stroke-linecap="round" opacity="0.8" fill="none">
    <path d="M248 42 L268 28 M255 48 L278 32 M252 52 L272 40"/>
    <path d="M262 30 L285 18 M268 26"/>
  </g>

  <!-- architectural nodes + grid anchors -->
  <g fill="#c678ff" opacity="0.75">
    <circle cx="72" cy="145" r="2"/><circle cx="168" cy="78" r="2"/><circle cx="262" cy="32" r="2"/>
    <circle cx="218" cy="62" r="2.2"/><circle cx="92" cy="42" r="1.8"/>
  </g>
  <g stroke="#c678ff" stroke-width="0.5" opacity="0.4" fill="none">
    <path d="M72 145 L92 42"/><path d="M168 78 L218 62"/><path d="M168 78 L262 32"/>
    <rect x="130" y="118" width="36" height="24" rx="1" stroke-dasharray="2,2"/>
  </g>

  <text x="16" y="24" fill="#c678ff" font-family="Courier New,monospace" font-size="9" letter-spacing="2">DIGITAL_ENERGY</text>
  <text x="16" y="38" fill="#5a4a7a" font-family="Courier New,monospace" font-size="8" letter-spacing="1">VFX · FLUSSI · TRACCE</text>
  <text x="16" y="188" fill="#3a3050" font-family="Courier New,monospace" font-size="7" letter-spacing="0.5">ombra · energia · acqua · correnti caos</text>
</svg>
