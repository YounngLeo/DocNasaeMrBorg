  <text x="14" y="22" fill="#4a3868" font-family="Courier New,monospace" font-size="6" letter-spacing="1.5">// SCie VFX · CORRENTI · TRACCE · v2.8</text>
  <text x="306" y="22" fill="#4a3868" font-family="Courier New,monospace" font-size="6" letter-spacing="1" text-anchor="end">WEBGL2</text>
  <text x="160" y="192" fill="#c678ff" font-family="Courier New,monospace" font-size="8" text-anchor="middle" letter-spacing="2.5">DIGITAL_ENERGY</text>
