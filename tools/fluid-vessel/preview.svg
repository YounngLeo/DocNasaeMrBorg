<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <rect width="320" height="200" fill="#050805"/>

  <!-- cornice tecnica + tacche -->
  <rect x="8" y="8" width="304" height="184" stroke="#1f3a25" stroke-width="0.5" stroke-dasharray="3,3"/>
  <g stroke="#1f3a25" stroke-width="0.5">
    <path d="M8 50 L14 50 M8 100 L14 100 M8 150 L14 150"/>
    <path d="M312 50 L306 50 M312 100 L306 100 M312 150 L306 150"/>
  </g>

  <defs>
    <marker id="ah-g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#5eff7e"/>
    </marker>
    <marker id="ah-m" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#d0d0d0"/>
    </marker>
  </defs>

  <!-- asse di simmetria -->
  <path d="M140 14 L140 186" stroke="#4a8a5e" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.7"/>

  <!-- contorno esterno del vaso (membrana) -->
  <path d="M140 180 Q88 172 80 120 Q74 72 100 46 Q126 24 140 22 Q154 22 180 46 Q206 72 200 120 Q192 172 140 180 Z"
        stroke="#fff03a" stroke-width="1.3" opacity="0.9"/>

  <!-- ============ META MODELLO (sx): mesh triangolare PBD ============ -->
  <g stroke="#fff03a" stroke-width="0.5" opacity="0.55">
    <path d="M140 30 L112 46 M140 52 L112 46 M140 52 L92 72 M140 82 L92 72 M140 82 L86 104 M140 112 L86 104 M140 112 L92 136 M140 142 L92 136 M140 142 L112 162 M140 168 L112 162"/>
    <path d="M112 46 L140 52 M92 72 L140 82 M86 104 L140 112 M92 136 L140 142 M112 162 L140 168"/>
    <path d="M112 46 L92 72 L86 104 L92 136 L112 162"/>
  </g>
  <g fill="#5eff7e" opacity="0.85">
    <circle cx="112" cy="46" r="1.6"/><circle cx="92" cy="72" r="1.6"/>
    <circle cx="86" cy="104" r="1.6"/><circle cx="92" cy="136" r="1.6"/>
    <circle cx="112" cy="162" r="1.6"/>
    <circle cx="140" cy="52" r="1.6"/><circle cx="140" cy="82" r="1.6"/>
    <circle cx="140" cy="112" r="1.6"/><circle cx="140" cy="142" r="1.6"/>
  </g>

  <!-- ============ META MODELLO (dx): sezione doppia parete ============ -->
  <!-- parete interna -->
  <path d="M140 36 Q154 38 172 56 Q192 78 187 119 Q180 161 140 168"
        stroke="#fff03a" stroke-width="0.9" opacity="0.7"/>
  <!-- tratteggio del muro (spessore) -->
  <g stroke="#fff03a" stroke-width="0.5" opacity="0.45">
    <path d="M180 46 L171 57 M196 72 L184 80 M201 100 L188 103 M199 128 L186 128 M190 152 L178 150 M170 170 L160 162"/>
  </g>

  <!-- ganci di sospensione + cavi + ancoraggi -->
  <g stroke="#d0d0d0" stroke-width="0.8">
    <path d="M112 46 L100 13 M140 22 L140 9 M180 46 L192 13"/>
    <path d="M112 46 q-5 4 -1 8 M180 46 q5 4 1 8"/>
    <circle cx="100" cy="11" r="2.4"/><circle cx="140" cy="8" r="2.4"/><circle cx="192" cy="11" r="2.4"/>
  </g>

  <!-- frecce di pressione interna (inflazione radiale) -->
  <g stroke="#5eff7e" stroke-width="0.8" opacity="0.85">
    <path d="M138 110 L112 110" marker-end="url(#ah-g)"/>
    <path d="M142 110 L168 110" marker-end="url(#ah-g)"/>
    <path d="M140 96 L140 78" marker-end="url(#ah-g)" opacity="0.6"/>
  </g>
  <text x="150" y="104" fill="#5eff7e" font-family="monospace" font-size="6" opacity="0.85">P</text>

  <!-- quota altezza H (sx) -->
  <g stroke="#d0d0d0" stroke-width="0.6" opacity="0.8">
    <path d="M40 24 L40 178" marker-start="url(#ah-m)" marker-end="url(#ah-m)"/>
    <path d="M37 24 L43 24 M37 178 L43 178"/>
  </g>
  <text x="34" y="104" fill="#4a8a5e" font-family="monospace" font-size="7" text-anchor="middle" transform="rotate(-90 34 104)">H</text>

  <!-- quota spessore t (dettaglio dx) -->
  <g stroke="#d0d0d0" stroke-width="0.6" opacity="0.8">
    <path d="M201 100 L246 92"/>
    <path d="M188 103 L246 110"/>
  </g>
  <text x="250" y="105" fill="#4a8a5e" font-family="monospace" font-size="7">t ×2</text>

  <!-- diametro belly -->
  <g stroke="#5eff7e" stroke-width="0.5" opacity="0.5">
    <path d="M82 120 L198 120" stroke-dasharray="2,2" marker-start="url(#ah-g)" marker-end="url(#ah-g)"/>
  </g>
  <text x="206" y="123" fill="#4a8a5e" font-family="monospace" font-size="6">&#216;</text>

  <!-- etichette tecniche -->
  <text x="14" y="22" fill="#294029" font-family="monospace" font-size="6" letter-spacing="1.5">// SOFT-BODY MEMBRANE · PBD</text>
  <text x="306" y="22" fill="#294029" font-family="monospace" font-size="6" letter-spacing="1" text-anchor="end">SEC. A–A</text>
  <text x="160" y="192" fill="#4a8a5e" font-family="monospace" font-size="8" text-anchor="middle" letter-spacing="2">FLUID_VESSEL</text>
</svg>
