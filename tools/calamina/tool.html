function bufferCorda(m, idx, freqHz, p){
  var c = m.chitarre[idx];
  var chiave = [Math.round(Math.log(freqHz) * 1731.234), Math.round(p.chiBrillantezzaHz),
                Math.round(p.chiSostegnoNorm * 50), Math.round(p.chiPizzicoNorm * 20),
                Math.round(p.chiPlettroMs), Math.round(p.chiSmorzoNorm * 10)].join('|');
  if (c.cache[chiave]) return c.cache[chiave];
  if (c.chiaviCnt > 96){ c.cache = {}; c.chiaviCnt = 0; }
  var pacchetto = sintetizzaCordaDati(freqHz, {
    brillantezzaHz:p.chiBrillantezzaHz, sostegnoNorm:p.chiSostegnoNorm, smorzoNorm:p.chiSmorzoNorm,
    pizzicoNorm:p.chiPizzicoNorm, plettroMs:p.chiPlettroMs, seme:Math.round(freqHz * 7) + 1
  }, m.ctx.sampleRate);
  var buffer = bufferDaDati(m.ctx, pacchetto);
  c.cache[chiave] = buffer; c.chiaviCnt++;
  return buffer;
}
function suonaChitarra(m, idx, tempoSec, evento){
  var ctx = m.ctx, c = m.chitarre[idx], p = m.stato.chi[idx].par;
  var gradi = ACCORDI.gradi[limita(p.chiAccordoIdx|0, 0, ACCORDI.gradi.length-1)];
  var corde = limita(p.chiCordeCnt|0, 1, 6);
  var ordine = [];
  for (var i = 0; i < corde; i++) ordine.push(i);
  var verso = p.chiStrumModoIdx|0;
  if (verso === 1) ordine.reverse();
  else if (verso === 2){ if (c.alternanza < 0) ordine.reverse(); c.alternanza = -c.alternanza; }
  else if (verso === 3 && evento.caso() < 0.5) ordine.reverse();
  var strum = (p.chiStrumMs / 1000) * (1 + bipolare(evento.caso) * p.chiVarStrumNorm);
  for (i = 0; i < ordine.length; i++){
    var corda = ordine[i];
    var intervallo = gradi[corda % gradi.length] + 12 * Math.floor(corda / gradi.length);
    var st = evento.gradoSt + intervallo;
    var stonatura = bipolare(evento.caso) * p.chiStonaturaCt;
    var freq = aFreq(quantizzaAScala(st, evento.scalaIdx)) * Math.pow(2, stonatura / 1200);
    var buffer = bufferCorda(m, idx, limita(freq, 30, 2200), p);
    var sorgente = ctx.createBufferSource();
    sorgente.buffer = buffer;
    var guadagno = ctx.createGain();
    guadagno.gain.value = limita(evento.ampiezza * (0.72 + 0.28 * (1 - i / Math.max(1, ordine.length))), 0.0001, 4);
    sorgente.connect(guadagno); guadagno.connect(c.ingresso);
    var quando = tempoSec + i * Math.abs(strum);
    try { sorgente.start(quando); } catch (e) { continue; }
    sorgente.stop(quando + buffer.duration + 0.05);
    m.vociAttive++;
    (function(s, g){
      s.onended = function(){ try { s.disconnect(); g.disconnect(); } catch (e) {} if (m.vociAttive > 0) m.vociAttive--; };
    })(sorgente, guadagno);
  }
}

/* ── lead ────────────────────────────────────────────────────────────────── */
function creaLead(ctx, bus){
  var l = { voci:[], ultimaFreqHz:220 };
  l.somma = ctx.createGain();
  l.sub = ctx.createOscillator(); l.sub.type = 'sine';
  l.subGuadagno = ctx.createGain(); l.subGuadagno.gain.value = 0;
  l.sub.connect(l.subGuadagno); l.subGuadagno.connect(l.somma); l.sub.start();
  l.filtro = ctx.createBiquadFilter(); l.filtro.type = 'lowpass';
  l.saturatore = ctx.createWaveShaper(); l.saturatore.oversample = '2x';
  l.ampiezza = ctx.createGain(); l.ampiezza.gain.value = 0.0001;
  l.pan = panoramizza(ctx);
  l.livello = ctx.createGain();
  l.mandataEco = ctx.createGain(); l.mandataRiverbero = ctx.createGain();
  l.somma.connect(l.filtro); l.filtro.connect(l.saturatore); l.saturatore.connect(l.ampiezza);
  l.ampiezza.connect(l.pan); l.pan.connect(l.livello);
  l.livello.connect(bus.ingresso);
  l.livello.connect(l.mandataEco); l.mandataEco.connect(bus.mandataEco);
  l.livello.connect(l.mandataRiverbero); l.mandataRiverbero.connect(bus.mandataRiverbero);
  l.vibrato = ctx.createOscillator(); l.vibrato.type = 'sine';
  l.vibratoAmpiezza = ctx.createGain(); l.vibratoAmpiezza.gain.value = 0;
  l.vibrato.connect(l.vibratoAmpiezza); l.vibrato.start();
  return l;
}
function sincronizzaVociLead(ctx, l, quante){
  while (l.voci.length < quante){
    var o = ctx.createOscillator(), g = ctx.createGain(), p = panoramizza(ctx);
    g.gain.value = 0.0001;
    o.connect(g); g.connect(p); p.connect(l.somma);
    l.vibratoAmpiezza.connect(o.detune);
    o.start();
    l.voci.push({ osc:o, guadagno:g, pan:p });
  }
  while (l.voci.length > quante){
    var v = l.voci.pop();
    try { v.osc.stop(); v.osc.disconnect(); v.guadagno.disconnect(); v.pan.disconnect(); } catch (e) {}
  }
}
function suonaLead(m, idx, tempoSec, evento){
  var l = m.lead[idx], p = m.stato.lea[idx].par;
  var glide = Math.max(0.0005, evento.glideMs / 1000);
  for (var i = 0; i < l.voci.length; i++){
    var f = l.voci[i].osc.frequency;
    f.cancelScheduledValues(tempoSec);
    f.setValueAtTime(Math.max(1, l.ultimaFreqHz), tempoSec);
    f.exponentialRampToValueAtTime(Math.max(1, evento.freqHz), tempoSec + glide);
  }
  l.sub.frequency.cancelScheduledValues(tempoSec);
  l.sub.frequency.setValueAtTime(Math.max(1, l.ultimaFreqHz / 2), tempoSec);
  l.sub.frequency.exponentialRampToValueAtTime(Math.max(1, evento.freqHz / 2), tempoSec + glide);
  l.ultimaFreqHz = Math.max(1, evento.freqHz);

  var taglio = limita(evento.filtroTaglioHz, 40, 18000);
  var apertura = limita(taglio * Math.pow(2, evento.filtroEnvOct), 40, 18000);
  l.filtro.frequency.cancelScheduledValues(tempoSec);
  l.filtro.frequency.setValueAtTime(apertura, tempoSec);
  l.filtro.frequency.exponentialRampToValueAtTime(taglio, tempoSec + evento.filtroDecadimentoMs / 1000);

  var picco = limita(evento.ampiezza, 0.0001, 4);
  var g = l.ampiezza.gain;
  g.cancelScheduledValues(tempoSec);
  g.setValueAtTime(Math.max(0.0001, g.value), tempoSec);
  g.linearRampToValueAtTime(picco, tempoSec + evento.attaccoMs / 1000);
  g.setTargetAtTime(Math.max(0.0001, picco * evento.sostegnoNorm),
                    tempoSec + evento.attaccoMs / 1000, Math.max(0.004, evento.decadimentoMs / 3000));

  l.vibratoAmpiezza.gain.cancelScheduledValues(tempoSec);
  l.vibratoAmpiezza.gain.setValueAtTime(0, tempoSec);
  l.vibratoAmpiezza.gain.linearRampToValueAtTime(p.leaVibratoCt,
    tempoSec + p.leaVibratoRitardoMs / 1000 + 0.01);
}
function rilasciaLead(m, idx, tempoSec, rilascioMs){
  chiudiCancello(m.lead[idx].ampiezza.gain, tempoSec, rilascioMs / 1000);
}

/* ══════════════════════════════════════════════════════════════════════════
   AGGIORNAMENTO CONTINUO + SEQUENZIATORE
   ══════════════════════════════════════════════════════════════════════════ */

function apriCancello(param, t, attSec, decSec, sostegnoNorm, picco){
  try { param.cancelScheduledValues(t); } catch (e) {}
  param.setValueAtTime(Math.max(0.0001, param.value), t);
  param.linearRampToValueAtTime(picco, t + Math.max(0.001, attSec));
  var s = Math.max(0.0001, picco * sostegnoNorm);
  param.setTargetAtTime(s, t + Math.max(0.001, attSec), Math.max(0.004, decSec / 3));
}
function chiudiCancello(param, t, relSec){
  try { param.cancelScheduledValues(t); } catch (e) {}
  param.setValueAtTime(Math.max(0.0001, param.value), t);
  param.setTargetAtTime(0.0001, t, Math.max(0.004, relSec / 3));
}

function aggiornaContinui(m, oraSec){
  var ctx = m.ctx, st = m.stato, b = m.bus, P = st.bus, k = 0.04, i;

  b.saturatore.curve = curvaSaturazione(ctx, P.busSaturazioneNorm);
  b.quantizz.curve = curvaQuantizzazione(P.busQuantizzBitCnt);
  b.passaAlto.frequency.setTargetAtTime(P.busPassaAltoHz, oraSec, k);
  b.passaBasso.frequency.setTargetAtTime(P.busPassaBassoHz, oraSec, k);
  b.compressore.threshold.value = P.busCompSogliaDb;
  b.compressore.ratio.value = P.busCompRapportoRatio;
  b.compressore.release.value = P.busCompRilascioMs / 1000;
  b.compressore.knee.value = 6;
  b.uscita.gain.setTargetAtTime(daDb(P.busLivelloDb), oraSec, k);

  var passoSec = durataPassoSec(st.trs.trsTempoBpm);
  var tempoEco = limita(passoSec * DIV_ECO[P.busEcoDivisoreIdx].fattore, 0.005, 3.9);
  b.ecoSin.delayTime.setTargetAtTime(tempoEco, oraSec, 0.08);
  b.ecoDes.delayTime.setTargetAtTime(tempoEco, oraSec, 0.08);
  b.ecoRitorno.gain.setTargetAtTime(P.busEcoRitornoNorm, oraSec, k);
  b.ecoFiltro.frequency.setTargetAtTime(P.busEcoTaglioHz, oraSec, k);
  b.ecoLivello.gain.setTargetAtTime(P.busEcoLivelloDb <= -60 ? 0 : daDb(P.busEcoLivelloDb), oraSec, k);

  var chiave = arrotonda(P.busRiverberoDurataSec,2) + '/' + arrotonda(P.busRiverberoDecadimentoNorm,2);
  if (chiave !== b.impulsoChiave){
    b.impulsoChiave = chiave;
    b.convolutore.buffer = creaImpulso(ctx, P.busRiverberoDurataSec, P.busRiverberoDecadimentoNorm);
  }
  b.riverberoFiltro.frequency.setTargetAtTime(P.busRiverberoTaglioHz, oraSec, k);
  b.riverberoLivello.gain.setTargetAtTime(P.busRiverberoLivelloDb <= -60 ? 0 : daDb(P.busRiverberoLivelloDb), oraSec, k);

  /* basso */
  for (i = 0; i < m.bassi.length; i++){
    var bb = m.bassi[i], pb = st.bas[i].par;
    var bAcceso = !!pb.basAttivoFlag && !mutoEffettivo(st, 'bas', i);
    bb.saturatore.curve = curvaSaturazione(ctx, pb.basSaturazioneNorm);
    bb.quantizz.curve = curvaQuantizzazione(pb.basQuantizzBitCnt);
    bb.subGuadagno.gain.setTargetAtTime(pb.basSubLivelloDb <= -59 ? 0 : daDb(pb.basSubLivelloDb) * 0.5, oraSec, k);
    impostaPan(bb.pan, pb.basPanNorm);
    bb.livello.gain.setTargetAtTime(bAcceso ? daDb(pb.basLivelloDb + (bb.varLivelloDb || 0)) : 0, oraSec, 0.06);
    bb.mandataEco.gain.setTargetAtTime(pb.basMandataEcoNorm, oraSec, k);
    bb.mandataRiverbero.gain.setTargetAtTime(pb.basMandataRiverberoNorm, oraSec, k);
  }
  /* chitarra */
  for (i = 0; i < m.chitarre.length; i++){
    var cc = m.chitarre[i], pc = st.chi[i].par;
    var cAcceso = !!pc.chiAttivoFlag && !mutoEffettivo(st, 'chi', i);
    cc.corpo.frequency.setTargetAtTime(pc.chiCorpoHz, oraSec, k);
    cc.corpo.Q.setTargetAtTime(pc.chiCorpoQRatio, oraSec, k);
    cc.distorsione.curve = curvaSaturazione(ctx, pc.chiDistorsioneNorm);
    cc.quantizz.curve = curvaQuantizzazione(pc.chiQuantizzBitCnt);
    cc.cassa.frequency.setTargetAtTime(pc.chiCassaTaglioHz, oraSec, k);
    cc.presenza.gain.setTargetAtTime(pc.chiPresenzaDb, oraSec, k);
    cc.ingresso.gain.setTargetAtTime(1 / (1 + pc.chiDistorsioneNorm * 1.6), oraSec, k);
    impostaPan(cc.pan, pc.chiPanNorm);
    cc.livello.gain.setTargetAtTime(cAcceso ? daDb(pc.chiLivelloDb + (cc.varLivelloDb || 0)) : 0, oraSec, 0.06);
    cc.mandataEco.gain.setTargetAtTime(pc.chiMandataEcoNorm, oraSec, k);
    cc.mandataRiverbero.gain.setTargetAtTime(pc.chiMandataRiverberoNorm, oraSec, k);
  }
  /* lead */
  for (i = 0; i < m.lead.length; i++){
    var ll = m.lead[i], pl = st.lea[i].par;
    var lAcceso = !!pl.leaAttivoFlag && !mutoEffettivo(st, 'lea', i);
    sincronizzaVociLead(ctx, ll, limita(pl.leaVociCnt | 0, 1, 5));
    var formaLead = FORME_ONDA[limita(pl.leaFormaIdx | 0, 0, 3)];
    for (var vl = 0; vl < ll.voci.length; vl++){
      var voceLead = ll.voci[vl];
      if (voceLead.osc.type !== formaLead) voceLead.osc.type = formaLead;
      voceLead.osc.detune.setTargetAtTime((vl - (ll.voci.length - 1) / 2) * pl.leaStonaturaCt, oraSec, 0.05);
      voceLead.guadagno.gain.setTargetAtTime(0.85 / Math.max(1, ll.voci.length), oraSec, k);
      impostaPan(voceLead.pan, ll.voci.length === 1 ? 0
        : ((vl / (ll.voci.length - 1)) * 2 - 1) * pl.leaLarghezzaNorm);
    }
    ll.subGuadagno.gain.setTargetAtTime(pl.leaSubLivelloDb <= -59 ? 0 : daDb(pl.leaSubLivelloDb), oraSec, k);
    ll.filtro.type = TIPI_FILTRO[pl.leaFiltroTipoIdx] || 'lowpass';
    ll.filtro.Q.setTargetAtTime(pl.leaFiltroQRatio, oraSec, k);
    ll.saturatore.curve = curvaSaturazione(ctx, pl.leaSaturazioneNorm);
    ll.vibrato.frequency.setTargetAtTime(pl.leaVibratoHz, oraSec, 0.05);
    impostaPan(ll.pan, pl.leaPanNorm);
    ll.livello.gain.setTargetAtTime(lAcceso ? daDb(pl.leaLivelloDb + (ll.varLivelloDb || 0)) : 0, oraSec, 0.06);
    ll.mandataEco.gain.setTargetAtTime(pl.leaMandataEcoNorm, oraSec, k);
    ll.mandataRiverbero.gain.setTargetAtTime(pl.leaMandataRiverberoNorm, oraSec, k);
  }

  /* droni */
  for (i = 0; i < m.droni.length; i++){
    var d = m.droni[i], p = st.drn[i].par;
    var acceso = !!p.drnAttivoFlag && !mutoEffettivo(st, 'drn', i);
    var vociCnt = acceso ? (p.drnModoIdx === 1 ? 0 : p.drnVociCnt | 0) : 0;
    sincronizzaVociDrone(ctx, d, vociCnt);
    var gradi = ACCORDI.gradi[p.drnAccordoIdx] || [0];
    var forma = FORME_ONDA[p.drnFormaIdx] || 'sine';
    for (var v = 0; v < d.voci.length; v++){
      var voce = d.voci[v];
      var intervallo = gradi[v % gradi.length] + 12 * Math.floor(v / gradi.length);
      var st0 = st.trs.trsTonicaSt + p.drnGradoSt + intervallo + (d.varGradoSt || 0);
      var scarto = (v - (d.voci.length - 1) / 2) * p.drnStonaturaCt + voce.deriva;
      if (voce.osc.type !== forma) voce.osc.type = forma;
      voce.osc.frequency.setTargetAtTime(aFreq(quantizzaAScala(st0, st.trs.trsScalaIdx)) + p.drnBattimentoHz * (v % 2 ? 1 : -1) * 0.5, oraSec, 0.09);
      voce.osc.detune.setTargetAtTime(scarto, oraSec, 0.12);
      voce.guadagno.gain.setTargetAtTime(0.9 / Math.max(1, d.voci.length), oraSec, k);
      impostaPan(voce.pan, d.voci.length === 1 ? 0 : ((v / (d.voci.length - 1)) * 2 - 1) * p.drnLarghezzaNorm);
    }
    d.subOsc.frequency.setTargetAtTime(aFreq(st.trs.trsTonicaSt + p.drnGradoSt - 12), oraSec, 0.09);
    d.subGuadagno.gain.setTargetAtTime(acceso && p.drnSubLivelloDb > -59 ? daDb(p.drnSubLivelloDb) : 0, oraSec, k);
    d.filtro.type = TIPI_FILTRO[p.drnFiltroTipoIdx] || 'lowpass';
    var taglio = p.drnFiltroTaglioHz * Math.pow(2, (d.varTaglioOct || 0) + (d.tenuta || 0));
    d.filtro.frequency.setTargetAtTime(limita(taglio, 20, 20000), oraSec, 0.05);
    d.filtro.Q.setTargetAtTime(p.drnFiltroQRatio, oraSec, k);
    var casuale = p.drnLfoFormaIdx === 3;
    d.lfo.type = casuale ? 'sine' : (FORME_ONDA[p.drnLfoFormaIdx] || 'sine');
    d.lfo.frequency.setTargetAtTime(p.drnLfoFrequenzaHz, oraSec, 0.1);
    d.lfoAmpiezza.gain.setTargetAtTime(casuale ? 0 : p.drnLfoProfonditaOct * 1200, oraSec, 0.1);
    d.saturatore.curve = curvaSaturazione(ctx, p.drnSaturazioneNorm);
    impostaPan(d.pan, p.drnPanNorm);
    d.livello.gain.setTargetAtTime(acceso ? daDb(p.drnLivelloDb + (d.varLivelloDb || 0)) : 0, oraSec, 0.06);
    d.mandataEco.gain.setTargetAtTime(p.drnMandataEcoNorm, oraSec, k);
    d.mandataRiverbero.gain.setTargetAtTime(p.drnMandataRiverberoNorm, oraSec, k);
    if (p.drnCancelloIdx === 0 && acceso && !d.aperto){
      d.aperto = true; apriCancello(d.cancello.gain, oraSec, p.drnAttaccoSec, 0.5, 1, 1);
    } else if ((p.drnCancelloIdx === 0 && !acceso) && d.aperto){
      d.aperto = false; chiudiCancello(d.cancello.gain, oraSec, p.drnRilascioSec);
    } else if (p.drnCancelloIdx === 2 && acceso && !d.aperto){
      d.aperto = true; apriCancello(d.cancello.gain, oraSec, p.drnAttaccoSec, 0.5, 1, 1);
    }
    if (p.drnCancelloIdx !== 0 && p.drnCancelloIdx !== 2 && !acceso && d.aperto){
      d.aperto = false; chiudiCancello(d.cancello.gain, oraSec, p.drnRilascioSec);
    }
  }

  /* rumori */
  for (i = 0; i < m.rumori.length; i++){
    var r = m.rumori[i], q = st.noi[i].par;
    var attivo = !!q.noiAttivoFlag && !mutoEffettivo(st, 'noi', i);
    var tipo = TIPI_RUMORE[q.noiTipoIdx] || 'bianco';
    impostaSorgenteRumore(ctx, r, tipo, m.bufferRumori);
    var granulare = (tipo === 'crepitio' || tipo === 'campione');
    r.continuo.gain.setTargetAtTime(granulare ? 0 : 1, oraSec, 0.02);
    r.filtro.type = TIPI_FILTRO[q.noiFiltroTipoIdx] || 'bandpass';
    var mod = (r.spazzataOct || 0) + (r.tenutaValore || 0) + (r.varTaglioOct || 0);
    r.filtro.frequency.setTargetAtTime(limita(q.noiFiltroTaglioHz * Math.pow(2, mod), 20, 20000), oraSec, 0.03);
    r.filtro.Q.setTargetAtTime(q.noiFiltroQRatio, oraSec, k);
    r.risIngresso.gain.setTargetAtTime(q.noiRisuonatoreFlag ? 0.7 : 0, oraSec, 0.03);
    r.secco.gain.setTargetAtTime(q.noiRisuonatoreFlag ? 0.45 : 1, oraSec, 0.03);
    r.ritardo.delayTime.setTargetAtTime(limita(1 / q.noiRisuonatoreHz, 0.0004, 0.49), oraSec, 0.05);
    r.risRitorno.gain.setTargetAtTime(q.noiRisuonatoreRitornoNorm, oraSec, k);
    r.risFiltro.frequency.setTargetAtTime(q.noiRisuonatoreTaglioHz, oraSec, k);
    r.saturatore.curve = curvaSaturazione(ctx, q.noiSaturazioneNorm);
    impostaPan(r.pan, limita(q.noiPanNorm + (r.varPanNorm || 0), -1, 1));
    r.livello.gain.setTargetAtTime(attivo ? daDb(q.noiLivelloDb + (r.varLivelloDb || 0)) : 0, oraSec, 0.06);
    r.mandataEco.gain.setTargetAtTime(q.noiMandataEcoNorm, oraSec, k);
    r.mandataRiverbero.gain.setTargetAtTime(q.noiMandataRiverberoNorm, oraSec, k);
    if (q.noiCancelloIdx === 0){
      if (!r.aperto){ r.aperto = true; apriCancello(r.cancello.gain, oraSec, q.noiAttaccoMs/1000, q.noiDecadimentoMs/1000, 1, 1); }
    } else if (r.aperto && q.noiCancelloIdx === 1 && !attivo){
      r.aperto = false; chiudiCancello(r.cancello.gain, oraSec, q.noiRilascioMs/1000);
    }
  }
}

function mutoEffettivo(stato, genere, idx){
  var tracce = elencoTracce(stato), soloAttivo = false, mia = null;
  for (var i = 0; i < tracce.length; i++){
    if (tracce[i].rif.seq.seqSoloFlag) soloAttivo = true;
    if (tracce[i].genere === genere && tracce[i].idx === idx) mia = tracce[i];
  }
  if (!mia) return false;
  if (mia.rif.seq.seqMutoFlag) return true;
  return soloAttivo && !mia.rif.seq.seqSoloFlag;
}

/* ── sequenziatore ───────────────────────────────────────────────────────── */
function creaSequenziatore(m, stato, alGiro){
  var S = {
    attivo:false, timer:null, caso:creaCaso(stato.ale.aleSemeCnt),
    orologi:[], visivoIdx:0, prossimoVisivoSec:0, cicloCnt:0, ultimoAvanzamentoSec:0
  };
  function azzera(){
    S.orologi = elencoTracce(stato).map(function(){ return { idx:0, senso:1, prossimoSec:0, cicli:0 }; });
    S.visivoIdx = 0; S.cicloCnt = 0;
  }
  azzera();

  S.avvia = function(){
    if (S.attivo) return;
    S.attivo = true;
    S.caso = creaCaso(stato.ale.aleSemeCnt);
    var ora = m.ctx.currentTime + 0.08;
    azzera();
    S.orologi.forEach(function(o){ o.prossimoSec = ora; });
    S.prossimoVisivoSec = ora;
    m.droni.forEach(function(d){ d.prossimoGranoSec = ora; });
    m.rumori.forEach(function(r){ r.prossimoGranoSec = ora; r.prossimaTenutaSec = ora; });
    S.timer = setInterval(battito, INTERVALLO_MS);
    battito();
  };
  S.ferma = function(){
    if (!S.attivo) return;
    S.attivo = false;
    clearInterval(S.timer); S.timer = null;
    var ora = m.ctx.currentTime;
    m.droni.forEach(function(d){ if (d.aperto){ d.aperto = false; chiudiCancello(d.cancello.gain, ora, 0.4); } });
    m.rumori.forEach(function(r){ if (r.aperto){ r.aperto = false; chiudiCancello(r.cancello.gain, ora, 0.3); } });
  };
  S.aggiornaSoloContinui = function(){ aggiornaContinui(m, m.ctx.currentTime); };

  function battito(){
    var ora = m.ctx.currentTime, limite = ora + LOOKAHEAD_SEC;
    aggiornaContinui(m, ora);
    pianificaGrani(limite);
    var tracce = elencoTracce(stato);
    var passoBaseSec = durataPassoSec(stato.trs.trsTempoBpm);

    while (S.prossimoVisivoSec < limite){
      S.visivoIdx = (S.visivoIdx + 1) % Math.max(1, stato.trs.trsPassiCnt);
      S.prossimoVisivoSec += passoBaseSec;
      if (S.visivoIdx === 0){ S.cicloCnt++; evolvi(); }
    }

    for (var t = 0; t < tracce.length; t++){
      var traccia = tracce[t], o = S.orologi[t];
      if (!o) { o = S.orologi[t] = { idx:0, senso:1, prossimoSec:ora, cicli:0 }; }
      var seq = traccia.rif.seq;
      var durata = passoBaseSec * DIVISORI[seq.seqDivisoreIdx].fattore;
      var lunghezza = Math.min(seq.seqLunghezzaCnt, stato.trs.trsPassiCnt);
      var guardia = 0;
      while (o.prossimoSec < limite && guardia++ < 256){
        var passo = seq.passi[o.idx % PASSI_MAX];
        var quando = o.prossimoSec + offsetSwingSec(o.idx, stato.trs.trsSwingNorm, durata)
                   + (stato.trs.trsUmanizzaMs / 1000) * bipolare(S.caso);
        if (!mutoEffettivo(stato, traccia.genere, traccia.idx))
          scatena(traccia, passo, Math.max(ora, quando), durata);
        var avanti = avanzaIndice(o.idx, lunghezza, seq.seqDirezioneIdx, o.senso, S.caso);
        o.idx = avanti.idx; o.senso = avanti.senso;
        o.prossimoSec += durata;
        if (seq.seqMutaNorm > 0 && S.caso() < seq.seqMutaNorm * 0.06) mutaPasso(seq, o.idx);
      }
    }
    if (alGiro) alGiro(S.visivoIdx);
  }

  function scatena(traccia, passo, quando, durataPassoSec_){
    var macro = stato.ale.aleQuantitaNorm;
    if (traccia.genere === 'smp'){
      var p = traccia.rif.par;
      var esito = decidiPasso(passo, p.smpProbabilitaNorm, p.smpVarProbabilitaNorm, S.caso, macro);
      if (!esito.suona) return;
      for (var r = 0; r < esito.ripetizioniCnt; r++){
        var t = quando + (durataPassoSec_ / esito.ripetizioniCnt) * r + passo.microMs / 1000;
        suonaCampione(m, traccia.idx, t, eventoCampione(p, passo, esito, r, esito.ripetizioniCnt, macro));
      }
    } else if (traccia.genere === 'bas'){
      var pb2 = traccia.rif.par;
      if (!pb2.basAttivoFlag) return;
      var eb = decidiPasso(passo, pb2.basProbabilitaNorm, 0, S.caso, macro);
      var bv = m.bassi[traccia.idx];
      if (!eb.suona){ bv.ultimoAttivo = false; return; }
      bv.varLivelloDb = bipolare(S.caso) * pb2.basVarLivelloDb * (0.25 + 0.75 * macro);
      var stBas = stato.trs.trsTonicaSt + pb2.basGradoSt + passo.intonazioneSt +
                  Math.round(bipolare(S.caso) * pb2.basVarGradoSt * (0.25 + 0.75 * macro));
      var glideBas = pb2.basGlideModoIdx === 1 ? true
                   : pb2.basGlideModoIdx === 2 ? false : bv.ultimoAttivo;
      var accento = passo.velocitaNorm >= 0.8 ? pb2.basAccentoNorm : 0;
      var durataBas = durataPassoSec_ * eb.ripetizioniCnt;
      suonaBasso(m, traccia.idx, quando, {
        freqHz: aFreq(quantizzaAScala(stBas, stato.trs.trsScalaIdx)),
        glide: glideBas, glideMs: pb2.basGlideMs,
        accentoNorm: accento, ampiezza: passo.velocitaNorm,
        filtroTaglioHz: limita(pb2.basFiltroTaglioHz * Math.pow(2, bipolare(S.caso) * pb2.basVarFiltroTaglioOct * (0.25 + 0.75 * macro)), 30, 18000),
        filtroQRatio: pb2.basFiltroQRatio, filtroEnvOct: pb2.basFiltroEnvOct,
        filtroDecadimentoMs: pb2.basFiltroDecadimentoMs,
        attaccoMs: pb2.basAttaccoMs,
        decadimentoMs: pb2.basDecadimentoMs * (1 + bipolare(S.caso) * pb2.basVarDecadimentoNorm * 0.8),
        sostegnoNorm: pb2.basSostegnoNorm, durataSec: durataBas
      });
      rilasciaBasso(m, traccia.idx, quando + durataBas * 0.95, pb2.basRilascioMs);
      bv.ultimoAttivo = true;
    } else if (traccia.genere === 'chi'){
      var pc2 = traccia.rif.par;
      if (!pc2.chiAttivoFlag) return;
      var ec = decidiPasso(passo, pc2.chiProbabilitaNorm, 0, S.caso, macro);
      if (!ec.suona) return;
      var cv = m.chitarre[traccia.idx];
      cv.varLivelloDb = bipolare(S.caso) * pc2.chiVarLivelloDb * (0.25 + 0.75 * macro);
      suonaChitarra(m, traccia.idx, quando, {
        gradoSt: stato.trs.trsTonicaSt + pc2.chiGradoSt + passo.intonazioneSt +
                 Math.round(bipolare(S.caso) * pc2.chiVarGradoSt * (0.25 + 0.75 * macro)),
        scalaIdx: stato.trs.trsScalaIdx, ampiezza: passo.velocitaNorm, caso: S.caso
      });
    } else if (traccia.genere === 'lea'){
      var pl2 = traccia.rif.par;
      if (!pl2.leaAttivoFlag) return;
      var el = decidiPasso(passo, pl2.leaProbabilitaNorm, 0, S.caso, macro);
      if (!el.suona) return;
      var lv = m.lead[traccia.idx];
      lv.varLivelloDb = bipolare(S.caso) * pl2.leaVarLivelloDb * (0.25 + 0.75 * macro);
      var stLea = stato.trs.trsTonicaSt + pl2.leaGradoSt + passo.intonazioneSt +
                  Math.round(bipolare(S.caso) * pl2.leaVarGradoSt * (0.25 + 0.75 * macro));
      var durataLea = durataPassoSec_ * el.ripetizioniCnt;
      suonaLead(m, traccia.idx, quando, {
        freqHz: aFreq(quantizzaAScala(stLea, stato.trs.trsScalaIdx)),
        glideMs: pl2.leaGlideMs * (1 + bipolare(S.caso) * pl2.leaVarGlideNorm * 0.9),
        ampiezza: passo.velocitaNorm,
        filtroTaglioHz: limita(pl2.leaFiltroTaglioHz * Math.pow(2, bipolare(S.caso) * pl2.leaVarFiltroTaglioOct * (0.25 + 0.75 * macro)), 40, 18000),
        filtroEnvOct: pl2.leaFiltroEnvOct, filtroDecadimentoMs: pl2.leaFiltroDecadimentoMs,
        attaccoMs: pl2.leaAttaccoMs, decadimentoMs: pl2.leaDecadimentoMs,
        sostegnoNorm: pl2.leaSostegnoNorm
      });
      rilasciaLead(m, traccia.idx, quando + durataLea * 0.95, pl2.leaRilascioMs);
    } else if (traccia.genere === 'drn'){
      var pd = traccia.rif.par;
      if (!pd.drnAttivoFlag) return;
      var d = m.droni[traccia.idx];
      d.varGradoSt = Math.round(bipolare(S.caso) * pd.drnVarGradoSt * (0.25 + 0.75 * macro)) + passo.intonazioneSt;
      d.varTaglioOct = bipolare(S.caso) * pd.drnVarFiltroTaglioOct * (0.25 + 0.75 * macro);
      d.varLivelloDb = bipolare(S.caso) * pd.drnVarLivelloDb * (0.25 + 0.75 * macro);
      if (pd.drnCancelloIdx === 1){
        var e = decidiPasso(passo, 1, 0, S.caso, macro);
        if (!e.suona) return;
        d.aperto = true;
        apriCancello(d.cancello.gain, quando, pd.drnAttaccoSec, 0.6, 1, passo.velocitaNorm);
        chiudiCancello(d.cancello.gain, quando + durataPassoSec_ * e.ripetizioniCnt, pd.drnRilascioSec);
      } else if (pd.drnCancelloIdx === 2 && passo.attivoFlag){
        chiudiCancello(d.cancello.gain, quando, Math.min(0.4, pd.drnRilascioSec));
        apriCancello(d.cancello.gain, quando + durataPassoSec_ * 0.98, pd.drnAttaccoSec, 0.6, 1, 1);
      }
      if (pd.drnLfoFormaIdx === 3 && S.caso() < 0.5)
        d.tenuta = bipolare(S.caso) * pd.drnLfoProfonditaOct;
    } else {
      var pn = traccia.rif.par;
      if (!pn.noiAttivoFlag) return;
      var rr = m.rumori[traccia.idx];
      var es = decidiPasso(passo, pn.noiProbabilitaNorm, 0, S.caso, macro);
      rr.varTaglioOct = bipolare(S.caso) * pn.noiVarFiltroTaglioOct * (0.25 + 0.75 * macro);
      rr.varLivelloDb = bipolare(S.caso) * pn.noiVarLivelloDb * (0.25 + 0.75 * macro);
      rr.varPanNorm  = bipolare(S.caso) * pn.noiVarPanNorm * (0.25 + 0.75 * macro);
      if (pn.noiCancelloIdx === 0) return;
      var dec = pn.noiDecadimentoMs / 1000 * (1 + bipolare(S.caso) * pn.noiVarDecadimentoNorm);
      if (pn.noiCancelloIdx === 1){
        if (!es.suona) return;
        rr.aperto = true;
        apriCancello(rr.cancello.gain, quando, pn.noiAttaccoMs/1000, dec, pn.noiSostegnoNorm, passo.velocitaNorm);
        chiudiCancello(rr.cancello.gain, quando + durataPassoSec_ * es.ripetizioniCnt * 0.98, pn.noiRilascioMs/1000);
      } else if (passo.attivoFlag){
        chiudiCancello(rr.cancello.gain, quando, pn.noiRilascioMs/1000);
        apriCancello(rr.cancello.gain, quando + durataPassoSec_ * 0.98, pn.noiAttaccoMs/1000, dec, 1, 1);
      }
    }
  }

  function eventoCampione(p, passo, esito, ripIdx, ripCnt, macro){
    var c = S.caso;
    var vel = passo.velocitaNorm * (ripCnt > 1 ? (0.55 + 0.45 * (ripIdx + 1) / ripCnt) : 1);
    return {
      ampiezza: daDb(valoreVariato(trovaDescrittore('smpLivelloDb'), p.smpLivelloDb, p.smpVarLivelloDb, c, macro)) * vel,
      intonazioneSt: p.smpIntonazioneSt + passo.intonazioneSt +
        Math.round(bipolare(c) * p.smpVarIntonazioneSt * (0.25 + 0.75 * macro)),
      stonaturaCt: p.smpStonaturaCt,
      puntoInizioNorm: valoreVariato(trovaDescrittore('smpPuntoInizioNorm'), p.smpPuntoInizioNorm, p.smpVarPuntoInizioNorm, c, macro),
      puntoFineNorm: p.smpPuntoFineNorm,
      inversione: !!p.smpInversioneFlag,
      attaccoMs: p.smpAttaccoMs, tenutaMs: p.smpTenutaMs,
      rilascioMs: p.smpRilascioMs * (1 + bipolare(c) * p.smpVarRilascioNorm * 0.9),
      curvaNorm: p.smpCurvaNorm,
      filtroTipoIdx: p.smpFiltroTipoIdx,
      filtroTaglioHz: limita(p.smpFiltroTaglioHz * Math.pow(2, bipolare(c) * p.smpVarFiltroTaglioOct * (0.25 + 0.75 * macro)), 20, 20000),
      filtroQRatio: p.smpFiltroQRatio, filtroEnvOct: p.smpFiltroEnvOct,
      saturazioneNorm: p.smpSaturazioneNorm, quantizzBitCnt: p.smpQuantizzBitCnt,
      panNorm: valoreVariato(trovaDescrittore('smpPanNorm'), p.smpPanNorm, p.smpVarPanNorm, c, macro),
      mandataEcoNorm: p.smpMandataEcoNorm, mandataRiverberoNorm: p.smpMandataRiverberoNorm,
      gruppoChokeIdx: p.smpGruppoChokeIdx
    };
  }

  function pianificaGrani(limite){
    var ctx = m.ctx, i;
    for (i = 0; i < m.droni.length; i++){
      var d = m.droni[i], p = stato.drn[i].par;
      if (!p.drnAttivoFlag || p.drnModoIdx === 0 || mutoEffettivo(stato, 'drn', i)){ d.prossimoGranoSec = Math.max(d.prossimoGranoSec, ctx.currentTime); continue; }
      var buf = m.slot[p.drnSorgenteSlotIdx] ? (p.drnGranoInversioneFlag ? m.slot[p.drnSorgenteSlotIdx].bufferInverso : m.slot[p.drnSorgenteSlotIdx].buffer) : null;
      if (!buf) continue;
      if (d.prossimoGranoSec < ctx.currentTime) d.prossimoGranoSec = ctx.currentTime;
      var guardia = 0;
      while (d.prossimoGranoSec < limite && guardia++ < 200){
        var ancora = p.drnGranoPosizioneNorm;
        var precedente = d.posizioneNorm === undefined ? ancora : d.posizioneNorm;
        d.posizioneNorm = limita(precedente * 0.95 + ancora * 0.05
                          + bipolare(S.caso) * p.drnGranoDerivaNorm * 0.05, 0, 1);
        var sco = Math.round(bipolare(S.caso) * p.drnGranoVarIntonazioneSt);
        suonaGrano(ctx, d.somma, buf, d.prossimoGranoSec, {
          durataSec: p.drnGranoDurataMs / 1000 * (1 + bipolare(S.caso) * p.drnGranoDispersioneNorm * 0.6),
          rapporto: Math.pow(2, (p.drnGranoIntonazioneSt + sco + stato.trs.trsTonicaSt * 0) / 12),
          posizioneSec: (d.posizioneNorm + bipolare(S.caso) * p.drnGranoDispersioneNorm * 0.2) * buf.duration,
          panNorm: bipolare(S.caso) * p.drnLarghezzaNorm,
          ampiezza: 0.5
        });
        d.prossimoGranoSec += (1 / p.drnGranoDensitaHz) * (1 + bipolare(S.caso) * p.drnGranoDispersioneNorm * 0.8);
      }
    }
    for (i = 0; i < m.rumori.length; i++){
      var r = m.rumori[i], q = stato.noi[i].par;
      var tipo = TIPI_RUMORE[q.noiTipoIdx];
      /* campiona e tieni sul taglio */
      if (r.prossimaTenutaSec < ctx.currentTime) r.prossimaTenutaSec = ctx.currentTime;
      while (r.prossimaTenutaSec < limite){
        r.tenutaValore = bipolare(S.caso) * q.noiTenutaProfonditaOct;
        r.prossimaTenutaSec += 1 / q.noiTenutaFrequenzaHz;
      }
      r.spazzataOct = Math.sin(ctx.currentTime * 2 * Math.PI * q.noiSpazzolaFrequenzaHz) * q.noiSpazzolaProfonditaOct;
      if (tipo !== 'crepitio' && tipo !== 'campione'){ r.prossimoGranoSec = Math.max(r.prossimoGranoSec, ctx.currentTime); continue; }
      if (!q.noiAttivoFlag || mutoEffettivo(stato, 'noi', i)) { r.prossimoGranoSec = ctx.currentTime; continue; }
      var sorgente = tipo === 'campione'
        ? (m.slot[q.noiSorgenteSlotIdx] && m.slot[q.noiSorgenteSlotIdx].buffer)
        : m.bufferRumori.bianco;
      if (!sorgente) continue;
      if (r.prossimoGranoSec < ctx.currentTime) r.prossimoGranoSec = ctx.currentTime;
      var g2 = 0;
      while (r.prossimoGranoSec < limite && g2++ < 400){
        suonaGrano(ctx, r.grani, sorgente, r.prossimoGranoSec, {
          durataSec: q.noiGranoDurataMs / 1000 * (1 + bipolare(S.caso) * q.noiGranoDispersioneNorm),
          rapporto: 1 + bipolare(S.caso) * q.noiGranoDispersioneNorm * 0.9,
          posizioneSec: S.caso() * sorgente.duration,
          panNorm: bipolare(S.caso) * 0.7,
          ampiezza: 0.35 + S.caso() * 0.4
        });
        r.prossimoGranoSec += (1 / q.noiDensitaHz) * (0.5 + S.caso());
      }
    }
  }

  function mutaPasso(seq, idx){
    var p = seq.passi[idx % PASSI_MAX];
    var r = S.caso();
    if (r < 0.34) p.attivoFlag = p.attivoFlag ? 0 : 1;
    else if (r < 0.67) p.velocitaNorm = limita(p.velocitaNorm + bipolare(S.caso) * 0.4, 0.05, 1);
    else p.ripetizioniCnt = 1 + Math.floor(S.caso() * 3);
  }
  function evolvi(){
    var e = stato.ale.aleEvoluzioneNorm;
    if (e <= 0) return;
    var tracce = elencoTracce(stato);
    for (var t = 0; t < tracce.length; t++){
      var seq = tracce[t].rif.seq;
      for (var i = 0; i < Math.min(seq.seqLunghezzaCnt, PASSI_MAX); i++)
        if (S.caso() < e * 0.05) mutaPasso(seq, i);
    }
  }
  S.battito = battito;
  S.posizione = function(){ return S.visivoIdx; };
  return S;
}

/* ── operazioni generative sulla trama ───────────────────────────────────── */
function riempiEuclideo(seq, pulsazioniCnt, rotazioneCnt){
  var mappa = euclideo(pulsazioniCnt, seq.seqLunghezzaCnt, rotazioneCnt);
  for (var i = 0; i < PASSI_MAX; i++) seq.passi[i].attivoFlag = i < seq.seqLunghezzaCnt ? mappa[i] : 0;
}
function riempiCasuale(seq, densitaNorm, caso){
  for (var i = 0; i < seq.seqLunghezzaCnt; i++){
    seq.passi[i].attivoFlag = caso() < densitaNorm ? 1 : 0;
    seq.passi[i].velocitaNorm = limita(0.55 + caso() * 0.45, 0, 1);
    seq.passi[i].probabilitaNorm = caso() < 0.18 ? 0.3 + caso() * 0.6 : 1;
    seq.passi[i].ripetizioniCnt = caso() < 0.08 ? 2 + Math.floor(caso() * 3) : 1;
  }
}
function ruotaSequenza(seq, quanti){
  var L = seq.seqLunghezzaCnt, copia = seq.passi.slice(0, L), i;
  var r = ((quanti % L) + L) % L;
  for (i = 0; i < L; i++) seq.passi[i] = copia[(i - r + L) % L];
}
function svuotaSequenza(seq){
  for (var i = 0; i < PASSI_MAX; i++) seq.passi[i] = passoIniziale();
}

/* ══════════════════════════════════════════════════════════════════════════
   INTERFACCIA (iPad: bersagli grandi, trascinamento, nessuno scorrimento di pagina)
   ══════════════════════════════════════════════════════════════════════════ */

var STATO = null, MOTORE = null, SEQ = null, CTX = null;
var CONTROLLI = [], TRACCIA_SEL = 0, SLOT_SEL = 0, DRONE_SEL = 0, RUMORE_SEL = 0;
var STRUMENTO_SEL = 'bas', RIDISEGNA_STRUMENTI = null;
var MODO_CELLA = 'passo', PAGINA_IDX = 0, REGISTRAZIONE = null;
var CASO_UI = creaCaso(9176);

function el(tag, classe, testo){
  var e = document.createElement(tag);
  if (classe) e.className = classe;
  if (testo !== undefined && testo !== null) e.textContent = testo;
  return e;
}
function bottone(testo, classe, azione){
  var b = el('button', 'btn' + (classe ? ' ' + classe : ''), testo);
  b.type = 'button';
  b.addEventListener('click', function(ev){ ev.preventDefault(); azione(b); });
  return b;
}
function avvisa(testo){
  var a = document.getElementById('avviso');
  a.textContent = testo; a.classList.add('vedi');
  clearTimeout(avvisa._t);
  avvisa._t = setTimeout(function(){ a.classList.remove('vedi'); }, 1700);
}
function aggiornaControlli(){ CONTROLLI.forEach(function(c){ if (c.aggiorna) c.aggiorna(); }); }

/* ── cursore a trascinamento ─────────────────────────────────────────────── */
function creaCursore(d, ottieni, imposta){
  var c = el('div', 'cur' + (d.curva === 'flag' ? ' interruttore' : ''));
  var riempimento = el('div', 'riemp'), tacche = el('div', 'tacche');
  var etichetta = el('div', 'et', d.etichetta), valore = el('div', 'vl', '');
  c.appendChild(riempimento); c.appendChild(tacche); c.appendChild(etichetta); c.appendChild(valore);
  function dipingi(){
    var v = ottieni();
    riempimento.style.width = (valoreANorm(d, v) * 100) + '%';
    valore.textContent = formattaValore(d, v);
  }
  var presaId = null, xInizio = 0, yInizio = 0, normInizio = 0, mosso = false, tPrec = 0;
  c.addEventListener('pointerdown', function(ev){
    if (presaId !== null) return;
    presaId = ev.pointerId; try { c.setPointerCapture(presaId); } catch (e) {}
    xInizio = ev.clientX; yInizio = ev.clientY; normInizio = valoreANorm(d, ottieni());
    mosso = false; c.classList.add('presa');
    ev.preventDefault();
  });
  c.addEventListener('pointermove', function(ev){
    if (ev.pointerId !== presaId) return;
    var dx = ev.clientX - xInizio, dy = Math.abs(ev.clientY - yInizio);
    if (Math.abs(dx) > 3 || dy > 3) mosso = true;
    var fine = dy > 46;
    c.classList.toggle('fine', fine);
    var sensibilita = fine ? 0.16 : 1;
    var n = limita(normInizio + (dx / Math.max(60, c.offsetWidth)) * sensibilita, 0, 1);
    imposta(normAValore(d, n)); dipingi();
    ev.preventDefault();
  });
  function rilascia(ev){
    if (ev.pointerId !== presaId) return;
    try { c.releasePointerCapture(presaId); } catch (e) {}
    presaId = null; c.classList.remove('presa', 'fine');
    if (!mosso){
      var ora = Date.now();
      if (d.curva === 'flag'){ imposta(ottieni() ? 0 : 1); }
      else if (ora - tPrec < 340){ imposta(d.dif); avvisa(d.etichetta + ' → iniziale'); }
      tPrec = ora; dipingi();
    }
  }
  c.addEventListener('pointerup', rilascia);
  c.addEventListener('pointercancel', rilascia);
  c.aggiorna = dipingi; dipingi(); CONTROLLI.push(c);
  return c;
}
function creaScelta(d, ottieni, imposta){
  var box = el('div', 'scelta'), bottoni = [];
  d.opzioni.forEach(function(op, i){
    var b = el('button', null, op.toUpperCase()); b.type = 'button';
    b.addEventListener('click', function(){ imposta(i + d.min); dipingi(); });
    box.appendChild(b); bottoni.push(b);
  });
  function dipingi(){
    var v = Math.round(ottieni()) - d.min;
    bottoni.forEach(function(b, i){ b.classList.toggle('attivo', i === v); });
  }
  var involucro = el('div');
  involucro.appendChild(el('div', 'etg', d.etichetta));
  involucro.appendChild(box);
  involucro.aggiorna = dipingi; dipingi(); CONTROLLI.push(involucro);
  return involucro;
}
function creaControllo(d, ottieni, imposta){

function collegaCella(cella, ti, colonna){
  var presaId = null, yInizio = 0, valInizio = 0, mosso = false;
  function passo(){
    var traccia = elencoTracce(STATO)[ti];
    return traccia.rif.seq.passi[(PAGINA_IDX * PASSI_PAGINA + colonna) % PASSI_MAX];
  }
  cella.addEventListener('pointerdown', function(ev){
    if (presaId !== null) return;
    presaId = ev.pointerId; try { cella.setPointerCapture(presaId); } catch (e) {}
    yInizio = ev.clientY; mosso = false;
    var p = passo();
    valInizio = MODO_CELLA === 'velocita' ? p.velocitaNorm
              : MODO_CELLA === 'probabilita' ? p.probabilitaNorm
              : MODO_CELLA === 'ripetizioni' ? (p.ripetizioniCnt - 1) / 7
              : MODO_CELLA === 'micro' ? (p.microMs + 60) / 120
              : MODO_CELLA === 'intonazione' ? (p.intonazioneSt + 24) / 48 : 0;
    selezionaTraccia(ti);
    ev.preventDefault();
  });
  cella.addEventListener('pointermove', function(ev){
    if (ev.pointerId !== presaId || MODO_CELLA === 'passo') return;
    var dy = yInizio - ev.clientY;
    if (Math.abs(dy) > 4) mosso = true;
    var n = limita(valInizio + dy / 160, 0, 1), p = passo();
    if (MODO_CELLA === 'velocita') p.velocitaNorm = n;
    else if (MODO_CELLA === 'probabilita') p.probabilitaNorm = n;
    else if (MODO_CELLA === 'ripetizioni') p.ripetizioniCnt = 1 + Math.round(n * 7);
    else if (MODO_CELLA === 'micro') p.microMs = Math.round(n * 120 - 60);
    else if (MODO_CELLA === 'intonazione') p.intonazioneSt = Math.round(n * 48 - 24);
    dipingiCella(ti, colonna); ev.preventDefault();
  });
  function su(ev){
    if (ev.pointerId !== presaId) return;
    try { cella.releasePointerCapture(presaId); } catch (e) {}
    presaId = null;
    if (!mosso){ var p = passo(); p.attivoFlag = p.attivoFlag ? 0 : 1; dipingiCella(ti, colonna); }
  }
  cella.addEventListener('pointerup', su);
  cella.addEventListener('pointercancel', su);
}
function dipingiCella(ti, colonna){
  var g = GRIGLIA.celle[ti]; if (!g) return;
  var cella = g.celle[colonna];
  var seq = g.traccia.rif.seq;
  var indice = PAGINA_IDX * PASSI_PAGINA + colonna;
  var p = seq.passi[indice % PASSI_MAX];
  var fuori = indice >= Math.min(seq.seqLunghezzaCnt, STATO.trs.trsPassiCnt);
  cella.classList.toggle('attiva', !!p.attivoFlag);
  cella.classList.toggle('fuori', fuori);
  var lv = cella.firstChild, rip = cella.childNodes[1];
  var q = MODO_CELLA === 'probabilita' ? p.probabilitaNorm
        : MODO_CELLA === 'ripetizioni' ? (p.ripetizioniCnt - 1) / 7
        : MODO_CELLA === 'micro' ? (p.microMs + 60) / 120
        : MODO_CELLA === 'intonazione' ? (p.intonazioneSt + 24) / 48
        : p.velocitaNorm;
    lv.style.height = (p.attivoFlag || MODO_CELLA !== 'passo' ? q * 100 : 0) + '%';
  rip.textContent = p.ripetizioniCnt > 1 ? '×' + p.ripetizioniCnt : (p.probabilitaNorm < 1 ? '%' : '');
}
function dipingiGriglia(){
  GRIGLIA.celle.forEach(function(g, ti){
    g.nome.classList.toggle('sel', ti === TRACCIA_SEL);
    g.nome.muto.classList.toggle('acceso', !!g.traccia.rif.seq.seqMutoFlag);
    g.nome.solo.classList.toggle('acceso', !!g.traccia.rif.seq.seqSoloFlag);
    g.nome.tt.textContent = g.traccia.sigla + ' ' + g.traccia.rif.nome;

/* ── forma d'onda dello slot ─────────────────────────────────────────────── */
var RIDISEGNA_SLOT = null;
function disegnaOnda(canvas, buffer){
  var larghezza = canvas.clientWidth || 600, altezza = canvas.clientHeight || 120;
  var dpr = Math.min(2, glob.devicePixelRatio || 1);
  canvas.width = larghezza * dpr; canvas.height = altezza * dpr;
  var g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, larghezza, altezza);
  g.strokeStyle = '#16262a'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, altezza/2); g.lineTo(larghezza, altezza/2); g.stroke();
  if (!buffer) return;
  var dati = buffer.getChannelData(0), passo = Math.max(1, Math.floor(dati.length / larghezza));
  g.strokeStyle = '#3dff88'; g.globalAlpha = 0.9; g.beginPath();
  for (var x = 0; x < larghezza; x++){
    var i0 = x * passo, min = 1, max = -1;
    for (var i = 0; i < passo; i++){
      var v = dati[i0 + i] || 0;
      if (v < min) min = v; if (v > max) max = v;
    }
    g.moveTo(x + 0.5, altezza/2 - max * altezza/2 * 0.92);
    g.lineTo(x + 0.5, altezza/2 - min * altezza/2 * 0.92);
  }
  g.stroke(); g.globalAlpha = 1;
}

/* ── registrazione dell'uscita ───────────────────────────────────────────── */
function avviaRegistrazione(){
  if (REGISTRAZIONE) return;
  var nodo = CTX.createScriptProcessor ? CTX.createScriptProcessor(4096, 2, 2) : null;
  if (!nodo){ avvisa('registrazione non disponibile su questo browser'); return; }
  var sinistro = [], destro = [], campioniCnt = 0;
  nodo.onaudioprocess = function(ev){
    sinistro.push(new Float32Array(ev.inputBuffer.getChannelData(0)));
    destro.push(new Float32Array(ev.inputBuffer.getChannelData(1)));
    campioniCnt += ev.inputBuffer.length;
    if (campioniCnt > CTX.sampleRate * 600) fermaRegistrazione();
  };
  var muto = CTX.createGain(); muto.gain.value = 0;
  MOTORE.bus.uscita.connect(nodo); nodo.connect(muto); muto.connect(CTX.destination);
  REGISTRAZIONE = { nodo:nodo, muto:muto, sinistro:sinistro, destro:destro, avvioSec:CTX.currentTime };
  avvisa('registrazione avviata');
}
function fermaRegistrazione(){
  if (!REGISTRAZIONE) return;
  var r = REGISTRAZIONE; REGISTRAZIONE = null;
  r.nodo.onaudioprocess = null;
  try { MOTORE.bus.uscita.disconnect(r.nodo); r.nodo.disconnect(); r.muto.disconnect(); } catch (e) {}
  function unisci(blocchi){
    var n = blocchi.reduce(function(a, b){ return a + b.length; }, 0);
    var fuori = new Float32Array(n), off = 0;
    blocchi.forEach(function(b){ fuori.set(b, off); off += b.length; });
    return fuori;
  }
  var s = unisci(r.sinistro), d = unisci(r.destro);
  if (!s.length){ avvisa('nessun audio registrato'); return; }
  var wav = codificaWav([s, d], CTX.sampleRate);
  scarica(new Blob([wav], { type:'audio/wav' }), 'calamina-' + timbro() + '.wav');
  avvisa('registrazione salvata (' + Math.round(s.length / CTX.sampleRate) + ' s)');
}
function timbro(){
  var d = new Date(), z = function(v){ return (v < 10 ? '0' : '') + v; };
  return d.getFullYear() + z(d.getMonth()+1) + z(d.getDate()) + '-' + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds());
}
function scarica(blob, nome){
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1200);
}

function copiaDentro(destinazione, sorgente){
  for (var k in sorgente){
    var v = sorgente[k];
    if (v && typeof v === 'object'){
      if (!destinazione[k] || typeof destinazione[k] !== 'object')
        destinazione[k] = Array.isArray(v) ? [] : {};
      copiaDentro(destinazione[k], v);
    } else destinazione[k] = v;
  }
}

function scuotiParametri(ampiezzaNorm){
  function scuoti(oggetto, dominio){
    soloParametri(DESCRITTORI[dominio]).forEach(function(d){
      if (d.curva === 'flag' || d.id.indexOf('Var') > 0) return;
      if (d.id === 'trsTempoBpm' || d.id === 'trsPassiCnt' || d.id === 'aleSemeCnt') return;
      var n = valoreANorm(d, oggetto[d.id]);
      oggetto[d.id] = normAValore(d, limita(n + bipolare(CASO_UI) * ampiezzaNorm, 0, 1));
    });
  }
  STATO.slot.forEach(function(s){ scuoti(s.par, 'smp'); });
  STATO.drn.forEach(function(s){ scuoti(s.par, 'drn'); });
  STATO.noi.forEach(function(s){ scuoti(s.par, 'noi'); });
  scuoti(STATO.bus, 'bus');
  aggiornaControlli(); avvisa('parametri scossi');
}

/* ── ciclo di disegno ────────────────────────────────────────────────────── */
function cicloDisegno(){
  if (cicloDisegno.ultimaColonna === undefined) cicloDisegno.ultimaColonna = -2;
  requestAnimationFrame(cicloDisegno);
  if (!MOTORE || !SEQ) return;
  var passo = SEQ.posizione();
  var colonna = SEQ.attivo ? passo - PAGINA_IDX * PASSI_PAGINA : -1;
  if (colonna !== cicloDisegno.ultimaColonna){
    var precedente = cicloDisegno.ultimaColonna;
    cicloDisegno.ultimaColonna = colonna;
    GRIGLIA.testate.forEach(function(n, i){ n.classList.toggle('qui', i === colonna); });
    GRIGLIA.celle.forEach(function(g){
      if (precedente >= 0 && g.celle[precedente]) g.celle[precedente].classList.remove('corrente');
      if (colonna >= 0 && g.celle[colonna]) g.celle[colonna].classList.add('corrente');
    });
  }
  OROLOGIO_GRANDE.textContent = (passo + 1 < 10 ? '0' : '') + (passo + 1);
  OROLOGIO_PICCOLO.textContent = 'DI ' + STATO.trs.trsPassiCnt + ' · ' + MOTORE.vociAttive + ' VOCI';
  if (PANNELLO_MASTER && PANNELLO_MASTER.classList.contains('attivo')){
    var dati = new Uint8Array(MOTORE.bus.analizzatore.frequencyBinCount);
    MOTORE.bus.analizzatore.getByteTimeDomainData(dati);
    var picco = 0;
    for (var i = 0; i < dati.length; i += 4){
      var v = Math.abs(dati[i] - 128) / 128;
      if (v > picco) picco = v;
    }
    PANNELLO_MASTER.barra.style.width = Math.min(100, picco * 118) + '%';
  }
}

function accendiAudio(){
  var Costruttore = glob.AudioContext || glob.webkitAudioContext;
  CTX = new Costruttore({ latencyHint:'interactive' });
  if (CTX.state === 'suspended') CTX.resume();
  MOTORE = creaMotore(CTX, STATO);
  SEQ = creaSequenziatore(MOTORE, STATO, null);
  aggiornaContinui(MOTORE, CTX.currentTime);
  /* sblocco iOS: un impulso silenzioso */
  var s = CTX.createBufferSource();
  s.buffer = CTX.createBuffer(1, 1, CTX.sampleRate);
  s.connect(CTX.destination); s.start(0);
}

}

  });
}
