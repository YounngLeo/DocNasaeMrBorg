name: Cloudflare token
description: Resolve a Cloudflare API token (permanent token or OAuth refresh)

inputs:
  account_id:
    description: Cloudflare account ID
    required: true
  api_token:
    description: Permanent API token (preferred when set)
    required: false
  refresh_token:
    description: Wrangler OAuth refresh token (fallback, auto-renews access)
    required: false

runs:
  using: composite
  steps:
    - name: Resolve Cloudflare credentials
      shell: bash
      env:
        INPUT_API_TOKEN: ${{ inputs.api_token }}
        INPUT_REFRESH_TOKEN: ${{ inputs.refresh_token }}
        INPUT_ACCOUNT_ID: ${{ inputs.account_id }}
      run: |
        set -euo pipefail
        TOKEN=""
        if [ -n "$INPUT_API_TOKEN" ] && [[ ! "$INPUT_API_TOKEN" =~ ^cfoat_ ]]; then
          TOKEN="$INPUT_API_TOKEN"
          echo "Using permanent Cloudflare API token."
        elif [ -n "$INPUT_REFRESH_TOKEN" ]; then
          echo "Refreshing Cloudflare OAuth access token..."
          RESP=$(curl -fsS -X POST "https://dash.cloudflare.com/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "refresh_token=$INPUT_REFRESH_TOKEN" \
            --data-urlencode "client_id=54d11594-84e4-41aa-b438-e81b8fa78ee7")
          TOKEN=$(python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('access_token',''))" <<< "$RESP")
          if [ -z "$TOKEN" ]; then
            echo "OAuth refresh failed: $RESP"
            exit 1
          fi
          echo "OAuth access token renewed for this run."
        else
          echo "Missing Cloudflare credentials. Set CLOUDFLARE_API_TOKEN (permanent) or CLOUDFLARE_OAUTH_REFRESH_TOKEN."
          exit 1
        fi
        echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        echo "CLOUDFLARE_ACCOUNT_ID=$INPUT_ACCOUNT_ID" >> "$GITHUB_ENV"
