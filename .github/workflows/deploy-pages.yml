name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'workers/**'
      - '.github/workflows/deploy-portal-relay.yml'
      - '.github/workflows/deploy-tools-auth-mailer.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloudflare credentials
        uses: ./.github/actions/cloudflare-token
        with:
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          refresh_token: ${{ secrets.CLOUDFLARE_OAUTH_REFRESH_TOKEN }}
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name docnasae-mrborg --commit-dirty=true
