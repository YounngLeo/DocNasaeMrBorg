name: Deploy Portal Relay Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/cuore-portal-relay/**'
      - '.github/workflows/deploy-portal-relay.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare credentials
        uses: ./.github/actions/cloudflare-token
        with:
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          refresh_token: ${{ secrets.CLOUDFLARE_OAUTH_REFRESH_TOKEN }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cuore-portal-relay
          command: deploy
