name: Deploy Portal Relay Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/cuore-portal-relay/**'
      - '.github/workflows/deploy-portal-relay.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cuore-portal-relay
          command: deploy
